openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content-strategy
    description: LLM-powered social content strategy generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateStrategy
      tags: [content-strategy]
      summary: Generate a tailored social content strategy
      description: Uses the configured Anthropic Claude API to create platform-specific content ideas, short-form video hooks and scripts, carousel concepts, and calls to action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentStrategyInput"
      responses:
        "200":
          description: Generated content strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentStrategy"
        "400":
          description: The submitted business details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Claude did not return a usable content strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Anthropic API key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Anthropic API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContentStrategyInput:
      type: object
      additionalProperties: false
      properties:
        businessType:
          type: string
          minLength: 2
          maxLength: 120
        targetAudience:
          type: string
          minLength: 2
          maxLength: 500
        socialPlatform:
          type: string
          minLength: 2
          maxLength: 80
        productService:
          type: string
          minLength: 2
          maxLength: 300
        brandTone:
          type: string
          minLength: 2
          maxLength: 200
      required:
        - businessType
        - targetAudience
        - socialPlatform
        - productService
        - brandTone
    ContentIdea:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        angle:
          type: string
        format:
          type: string
      required: [title, angle, format]
    VideoScript:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        hook:
          type: string
        beats:
          type: array
          minItems: 3
          maxItems: 6
          items:
            type: string
        callToAction:
          type: string
      required: [title, hook, beats, callToAction]
    CarouselIdea:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        slides:
          type: array
          minItems: 4
          maxItems: 8
          items:
            type: string
      required: [title, slides]
    ContentStrategy:
      type: object
      additionalProperties: false
      properties:
        contentIdeas:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/ContentIdea"
        videoHooks:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
        videoScripts:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/VideoScript"
        carouselIdeas:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/CarouselIdea"
        callsToAction:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
      required:
        - contentIdeas
        - videoHooks
        - videoScripts
        - carouselIdeas
        - callsToAction
    ApiError:
      type: object
      properties:
        error:
          type: string
        setupRequired:
          type: boolean
      required: [error]

